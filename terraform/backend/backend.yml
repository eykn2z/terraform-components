AWSTemplateFormatVersion: "2010-09-09"
Description: "Terraform Backend Resources"

Parameters:
  Env:
    Type: String
    Description: "Env name"

  PJName:
    Type: String
    Description: "Project name"
    Default: "terraform-practice"

  Region:
    Type: String
    Default: ap-northeast-1
    Description: "AWS Region"

Resources:
  TerraformStateBucket:
    Type: "AWS::S3::Bucket"
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub "${Env}-${PJName}-tfstate"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Env
          Value: !Ref Env
        - Key: Project
          Value: !Ref PJName

  TerraformStateBucketPolicy:
    Type: "AWS::S3::BucketPolicy"
    DeletionPolicy: Retain
    Properties:
      Bucket: !Ref TerraformStateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowOrganizationAccess"
            Effect: "Allow"
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${TerraformStateBucket}"
              - !Sub "arn:aws:s3:::${TerraformStateBucket}/*"
            Condition:
              StringNotLike:
                "aws:PrincipalArn": "*:root"
          - Sid: "DenyNonSSLRequests"
            Effect: "Deny"
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${TerraformStateBucket}"
              - !Sub "arn:aws:s3:::${TerraformStateBucket}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  TerraformStateLockTable:
    Type: "AWS::DynamoDB::Table"
    Properties:
      TableName: !Sub "${Env}-${PJName}-tflock"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: LockID
          AttributeType: S
      KeySchema:
        - AttributeName: LockID
          KeyType: HASH
      Tags:
        - Key: Env
          Value: !Ref Env
        - Key: Project
          Value: !Ref PJName

Outputs:
  StateBucketName:
    Description: "Name of the S3 bucket for Terraform state"
    Value: !Ref TerraformStateBucket
    Export:
      Name: !Sub "${Env}-${PJName}-tfstate-bucket"

  StateLockTableName:
    Description: "Name of the DynamoDB table for state locking"
    Value: !Ref TerraformStateLockTable
    Export:
      Name: !Sub "${Env}-${PJName}-tflock-table"
