name: terraform-plan
on:
  workflow_dispatch:
    inputs:
      do-deploy:
        type: boolean
        description: deploy trigger
        default: false
  push:
    branches:
      - main
jobs:
  tflint:
    name: TFlint
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    timeout-minutes: 3
    defaults:
      run:
        shell: bash
        working-directory: ./terraform
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        name: Cache plugin dir
        with:
          path: ~/.tflint.d/plugins
          key: ${{ runner.os }}-tflint-${{ hashFiles('.tflint.hcl') }}

      - uses: terraform-linters/setup-tflint@v5
        name: Setup TFLint

      - name: Init TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: |
          tflint -f compact --force
          output=$(tflint --format=json --force)
          if echo "$output" | jq '.errors | length' | grep -qv 0; then
            echo "TFLint found errors"
            exit 1
          fi
  terraform:
    name: Terragrunt plan
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    timeout-minutes: 3
    defaults:
      run:
        shell: bash
        working-directory: ./terraform
    env:
      DEPLOY_BRANCH: deploy
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.1"
      - uses: autero1/action-terragrunt@v3
        with:
          terragrunt_version: latest
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: "${{ secrets.AWS_REGION }}"
          role-to-assume: "${{ secrets.AWS_ROLE_TO_ASSUME }}"

      - name: Terraform fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terragrunt Init
        id: tg-init
        env:
          TG_ENV: dev
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: terragrunt run-all init -reconfigure

      - name: Terragrunt Plan
        id: plan
        env:
          TG_ENV: dev
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: terragrunt run-all plan -no-color 2>&1 | tee plan.txt
        continue-on-error: false

      - name: "Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: plan.txt
          retention-days: 5

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
